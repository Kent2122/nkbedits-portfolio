backend:
  name: github
  repo: Kent2122/nkbedits-portfolio
  branch: main
  base_url: https://nkbedits-portfolio.vercel.app
  auth_endpoint: api/auth

# Commits made through the CMS will show up as this in git history.
publish_mode: simple

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "site_content"
    label: "Site Content"
    files:
      - file: "content/projects.json"
        label: "Portfolio Content"
        name: "portfolio_content"
        fields:
          - label: "Showreel"
            name: "showreel"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Video Embed URL", name: "embedUrl", widget: "string", required: false, hint: "YouTube (https://www.youtube.com/embed/VIDEO_ID), Vimeo (https://player.vimeo.com/video/VIDEO_ID), or a local file path like assets/videos/name.mp4 — leave blank to show 'coming soon'." }

          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{title}} — {{categoryLabel}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Reels", value: "reels" }
                  - { label: "Commercial", value: "commercial" }
                  - { label: "Motion Graphics", value: "motion" }
                  - { label: "Color Grading", value: "color" }
              - { label: "Category Label (shown on the card)", name: "categoryLabel", widget: "string" }
              - label: "Thumbnail Style"
                name: "thumb"
                widget: "select"
                options: ["thumb-1", "thumb-2", "thumb-3", "thumb-4", "thumb-5", "thumb-6"]
                hint: "Placeholder gradient until you add real thumbnails."
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Video Embed URL", name: "embedUrl", widget: "string", required: false, hint: "YouTube (https://www.youtube.com/embed/VIDEO_ID), Vimeo (https://player.vimeo.com/video/VIDEO_ID), or a local file path like assets/videos/name.mp4 — leave blank to show 'coming soon'." }
