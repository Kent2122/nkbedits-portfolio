backend:
  name: github
  repo: Kent2122/nkbedits-portfolio
  branch: main
  base_url: https://nkbedits-portfolio.vercel.app
  auth_endpoint: api/auth

# Commits made through the CMS will show up as this in git history.
publish_mode: simple

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "site_content"
    label: "Site Content"
    files:
      - file: "content/projects.json"
        label: "Portfolio Content"
        name: "portfolio_content"
        fields:
          - label: "Showreel"
            name: "showreel"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - label: "Orientation / Shape"
                name: "orientation"
                widget: "select"
                default: "landscape"
                options:
                  - { label: "Vertical", value: "portrait" }
                  - { label: "Horizontal", value: "landscape" }
              - { label: "Video Embed URL", name: "embedUrl", widget: "string", required: false, hint: "YouTube (https://www.youtube.com/embed/VIDEO_ID), Vimeo (https://player.vimeo.com/video/VIDEO_ID), or a local file path like assets/videos/name.mp4 — leave blank to show 'coming soon'." }

          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{title}} — {{categoryLabel}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Shorts Reels", value: "shorts-reels" }
                  - { label: "Commercials", value: "commercials" }
                  - { label: "Motion Graphics", value: "motion-graphics" }
                  - { label: "Graphic Designs", value: "graphic-designs" }
                  - { label: "Logos", value: "logos" }
                  - { label: "Mascots", value: "mascots" }
              - { label: "Category Label (shown on the card)", name: "categoryLabel", widget: "string" }
              - label: "Media Type"
                name: "mediaType"
                widget: "select"
                default: "video"
                options:
                  - { label: "Video", value: "video" }
                  - { label: "Image", value: "image" }
                hint: "Video gets hover-preview + a theater player with an Up Next list. Image opens a lightbox with prev/next arrows instead."
              - label: "Orientation / Shape"
                name: "orientation"
                widget: "select"
                default: "portrait"
                options:
                  - { label: "Vertical / Shorts (tall card, full-bleed)", value: "portrait" }
                  - { label: "Horizontal / YouTube-style (wide card, full-bleed)", value: "landscape" }
                  - { label: "Square (logos/mascots)", value: "square" }
              - label: "Thumbnail Image"
                name: "thumbnailUrl"
                widget: "image"
                required: false
                hint: "Upload your own thumbnail here — once set, it replaces the placeholder gradient below on the grid card."
              - label: "Thumbnail Style (placeholder gradient)"
                name: "thumb"
                widget: "select"
                options: ["thumb-1", "thumb-2", "thumb-3", "thumb-4", "thumb-5", "thumb-6"]
                hint: "Only used as a fallback color when no Thumbnail Image is uploaded above."
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Video Embed URL", name: "embedUrl", widget: "string", required: false, hint: "Only used when Media Type is Video. YouTube (https://www.youtube.com/embed/VIDEO_ID), Vimeo (https://player.vimeo.com/video/VIDEO_ID), or a local file path like assets/Reels/name.mp4 — leave blank to show 'coming soon'." }
              - { label: "Image URL", name: "imageUrl", widget: "string", required: false, hint: "Only used when Media Type is Image. A local file path like assets/uploads/name.jpg — leave blank to show 'coming soon'." }
